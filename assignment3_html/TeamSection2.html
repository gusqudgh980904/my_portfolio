    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<section class="bg-gray-50 py-16 px-6 ">
  <div class="max-w-7xl mx-auto px-6">
    <div class="text-center mb-12">
      <h2 class="text-3xl md:text-4xl font-bold text-gray-900">
        Our Team
      </h2>
      <p class="mt-4 text-gray-600">
        함께 성장하는 우리 팀을 소개합니다.
      </p>
    </div>


    <!-- 팀 카드 -->
    <div class="mt-12 grid gap-8 sm:grid-cols-2 lg:grid-cols-4" xl:grid-cols-4>

      <!-- 카드1 -->
      <div class="bg-white rounded-2xl shadow-md p-6 text-center hover:-translate-y-2 transition">
        <img
          src="/images/남자사원이미지1.png"
          alt="team member"
          class="w-28 h-28 mx-auto rounded-2xl object-cover mb-4"
        />
        <h3 class="text-xl font-semibold text-gray-900">김민수</h3>
        <p class="text-sm text-blue-600 mt-1">Frontend Developer</p>
        <p class="text-gray-600 text-sm mt-4">
          사용자 경험을 고려한 UI 개발을 담당합니다.
        </p>
      </div>
      <!-- 카드2 -->
      <div class="bg-white rounded-2xl shadow-md p-6 text-center hover:-translate-y-2 transition">
        <img
          src="/images/여자사원이미지1.png"
          alt="team member"
          class="w-28 h-28 mx-auto rounded-2xl object-cover mb-4"
        />
        <h3 class="text-xl font-semibold text-gray-900">이서연</h3>
        <p class="text-sm text-blue-600 mt-1">Backend Developer</p>
        <p class="text-gray-600 text-sm mt-4">
          안정적인 서버와 API 개발을 담당합니다.
        </p>
      </div>
      <!-- 카드3 -->
      <div class="bg-white rounded-2xl shadow-md p-6 text-center hover:-translate-y-2 transition">
        <img
          src="/images/남자사원이미지2.png"
          alt="team member"
          class="w-28 h-28 mx-auto rounded-2xl object-cover mb-4"
        />
        <h3 class="text-xl font-semibold text-gray-900">박지훈</h3>
        <p class="text-sm text-blue-600 mt-1">UI/UX Designer</p>
        <p class="text-gray-600 text-sm mt-4">
          직관적이고 깔끔한 디자인을 설계합니다.
        </p>
      </div>
      <!-- 카드4 -->
      <div class="bg-white rounded-2xl shadow-md p-6 text-center hover:-translate-y-2 transition">
        <img
          src="/images/여자사원이미지2.png"
          alt="team member"
          class="w-28 h-28 mx-auto rounded-2xl object-cover mb-4"
        />
        <h3 class="text-xl font-semibold text-gray-900">최유진</h3>
        <p class="text-sm text-blue-600 mt-1">Project Manager</p>
        <p class="text-gray-600 text-sm mt-4">
          프로젝트 일정과 팀 커뮤니케이션을 관리합니다.
        </p>
      </div>
    </div>
  </div>
</section>

</body>
</html>
