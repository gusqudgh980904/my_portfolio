<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-950 flex items-center justify-center p-6 text-white">

    <!-- Business Card -->
    <div class="w-full max-w-md rounded-3xl backdrop-blur-xl bg-white/10 border border-white/20 shadow-2xl overflow-hidden">

        <!-- Top Background Area -->
        <div class="h-32 bg-gradient-to-r from-red-600 via-purple-600 to-blue-600"></div>

        <!-- Profile Area -->
        <div class="relative px-8 pb-8">

            <!-- Profile Image -->
            <div class="absolute -top-14 left-8 w-28 h-28 rounded-full border-4 border-gray-950 bg-white/20 overflow-hidden flex items-center justify-center">

                <img src="/images\남자사원이미지1.png" 
                     alt="profile" 
                     class="w-full h-full object-cover">

                <span class="text-sm text-gray-300">PHOTO</span>
            </div>

            <!-- Name -->
            <div class="pt-20">
                <h1 class="text-3xl font-black tracking-wide">
                    현병호
                </h1>

                <p class="mt-2 text-red-400 font-semibold">
                    Fullstack Developer
                </p>

                <p class="mt-4 text-gray-300 leading-relaxed">
                    DB, Java, Spring Boot, HTML, CSS, JavaScript, Tailwind CSS 등을 활용해 ERP를 만들고 있는 개발자입니다.
                </p>
            </div>

            <!-- Info -->
            <div class="mt-6 space-y-3 text-sm">

                <div class="flex items-center justify-between border-b border-white/10 pb-3">
                    <span class="text-gray-400">Email</span>
                    <span>gusqudgh980904@naver.com</span>
                </div>

                <div class="flex items-center justify-between border-b border-white/10 pb-3">
                    <span class="text-gray-400">Phone</span>
                    <span>010-3891-2940</span>
                </div>

                <div class="flex items-center justify-between">
                    <span class="text-gray-400">Location</span>
                    <span>Incheon, Korea</span>
                </div>

            </div>

            <!-- Skills -->
            <div class="mt-8">
                <h2 class="text-lg font-bold mb-3">
                    Skills
                </h2>

                <div class="flex flex-wrap gap-2">
                    <span class="px-3 py-1 rounded-full bg-red-500/20 text-red-300 text-sm">HTML</span>
                    <span class="px-3 py-1 rounded-full bg-blue-500/20 text-blue-300 text-sm">CSS</span>
                    <span class="px-3 py-1 rounded-full bg-yellow-500/20 text-yellow-300 text-sm">JavaScript</span>
                    <span class="px-3 py-1 rounded-full bg-cyan-500/20 text-cyan-300 text-sm">Tailwind CSS</span>
                    <span class="px-3 py-1 rounded-full bg-green-500/20 text-green-300 text-sm">Java</span>
                    <span class="px-3 py-1 rounded-full bg-purple-500/20 text-purple-300 text-sm">Spring Boot</span>
                    <span class="px-3 py-1 rounded-full bg-pink-500/20 text-pink-300 text-sm">DB</span>
                </div>
            </div>

            <!-- Button -->
            <div class="mt-8">
                <a href="#"
                   class="block w-full text-center rounded-xl bg-red-600 py-3 font-bold hover:bg-red-700 transition">
                    Contact Me
                </a>
            </div>

        </div>
    </div>

</body>
</html>
